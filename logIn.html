<button onClick="login()" class="button">Login</button>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDYBHEl6FA7pLy9xK7evpt6tIOe7kMGTPo",
    authDomain: "myrobots-b7c56.firebaseapp.com",
    projectId: "myrobots-b7c56",
    storageBucket: "myrobots-b7c56.firebasestorage.app",
    messagingSenderId: "386271837038",
    appId: "1:386271837038:web:5ba3fd8cea3c254a451f7f",
    measurementId: "G-FEBWT55QW0"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // Login function
  window.login = function() {
    signInWithPopup(auth, provider)
      .then((result) => {
        const user = result.user;
        console.log("User logged in: ", user.displayName);
        alert("Logged in as: " + user.displayName);
      })
      .catch((error) => {
        alert("Login failed: " + error.message);
      });
  };

  // Detect login state changes
  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log("User is signed in:", user.displayName);
    } else {
      console.log("User is signed out");
    }
  });
</script>
